[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One version of the domain: send www to the bare domain, permanently.
# Netlify handles HTTP -> HTTPS on its own once the certificate is issued.
[[redirects]]
  from = "https://www.upperkai.com/*"
  to = "https://upperkai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.upperkai.com/*"
  to = "https://upperkai.com/:splat"
  status = 301
  force = true

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
